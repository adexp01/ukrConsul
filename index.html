<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fav.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCDI</title>
    <!--
      Шрифт — найперше. Без preload браузер дізнається про нього лише після
      того, як розбере CSS, і встигає намалювати перший екран резервним
      шрифтом: саме той стрибок тексту, який видно при заході на сторінку.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fixel-display/FixelDisplay-Regular.subset.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fixel-display/FixelDisplay-Medium.subset.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fixel-display/FixelDisplay-SemiBold.subset.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/fixel-display/FixelDisplay-Bold.subset.woff2"
      crossorigin
    />

    <!--
      Перші кадри кільця на головному екрані. Без цього вони починають
      вантажитись аж після того, як виконається бандл, і екран стоїть порожній.
    -->
    <link
      rel="preload"
      as="image"
      href="/animation/frames/SHIELD_ALPHA_00000.webp"
    />
    <link
      rel="preload"
      as="image"
      href="/animation/frames/SHIELD_ALPHA_00002.webp"
    />
    <link
      rel="preload"
      as="image"
      href="/animation/frames/SHIELD_ALPHA_00004.webp"
    />
    <link
      rel="preload"
      as="image"
      href="/animation/frames/SHIELD_ALPHA_00006.webp"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
