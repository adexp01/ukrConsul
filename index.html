<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050813" />

    <!--
      Дефолтні мета-теги. Після `vite build` скрипт scripts/prerender-seo.mjs
      замінює цей блок на теги конкретної сторінки й локалі — тут лишається
      те, що бачить dev-сервер і будь-який маршрут без свого статичного HTML.
    -->
    <title>Ukrainian Council of Defence Industry</title>
    <meta
      name="description"
      content="UCDI unites Ukraine's private defence manufacturers and associations, representing the industry before the state, the military and international partners."
    />
    <link rel="canonical" href="https://www.ucdi.org.ua/en" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ukrainian Council of Defence Industry" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Ukrainian Council of Defence Industry" />
    <meta
      property="og:description"
      content="UCDI unites Ukraine's private defence manufacturers and associations, representing the industry before the state, the military and international partners."
    />
    <meta property="og:url" content="https://www.ucdi.org.ua/en" />
    <meta property="og:image" content="https://www.ucdi.org.ua/og/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Ukrainian Council of Defence Industry" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ukrainian Council of Defence Industry" />
    <meta
      name="twitter:description"
      content="UCDI unites Ukraine's private defence manufacturers and associations, representing the industry before the state, the military and international partners."
    />
    <meta name="twitter:image" content="https://www.ucdi.org.ua/og/og-en.png" />
    <link rel="alternate" hreflang="en" href="https://www.ucdi.org.ua/en" />
    <link rel="alternate" hreflang="uk" href="https://www.ucdi.org.ua/ua" />
    <link rel="alternate" hreflang="x-default" href="https://www.ucdi.org.ua/en" />
    <!--
      Перші кадри кільця на головному екрані. Без цього вони починають
      вантажитись аж після того, як виконається бандл, і екран стоїть порожній.
    -->
    <link
      rel="preload"
      as="image"
      href="/animation/frames/SHIELD_ALPHA_00000.webp"

      rel="preload"

    />
